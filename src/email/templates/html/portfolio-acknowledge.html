<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f3f4f6; }
    .container { max-width: 520px; margin: 30px auto; background-color: #111827; border-radius: 12px; border: 1px solid #1f2937; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .badge { display: inline-block; background-color: #1e293b; color: #38bdf8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; padding: 5px 12px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #334155; }
    h1 { margin: 0 0 14px 0; font-size: 22px; color: #ffffff; font-weight: 700; }
    p { font-size: 15px; line-height: 1.7; color: #cbd5e1; margin: 0 0 16px 0; }
    .links-box { margin-top: 24px; padding-top: 18px; border-top: 1px solid #1f2937; }
    .link-btn { display: inline-block; background-color: #2563eb; color: #ffffff !important; text-decoration: none; padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-right: 12px; }
    .secondary-link { display: inline-block; color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 500; }
    .footer { margin-top: 28px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Message Received</div>
    <h1>Hi {{visitorName}},</h1>
    <p>
      Thank you for reaching out through my portfolio. I have received your message and will get back to you within 24 hours. Looking forward to connecting!
    </p>

    <div class="links-box">
      <a href="https://rudreshp.me" target="_blank" class="link-btn">View Portfolio &rarr;</a>
      <a href="https://github.com/rudresh" target="_blank" class="secondary-link">GitHub</a>
    </div>

    <div class="footer">
      Rudresh Patel &bull; Portfolio
    </div>
  </div>
</body>
</html>
