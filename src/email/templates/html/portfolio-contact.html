<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e2e8f0; }
    .container { max-width: 560px; margin: 30px auto; background-color: #1e293b; border-radius: 10px; border: 1px solid #334155; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .badge { display: inline-block; background-color: #0284c7; color: #ffffff; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; padding: 4px 10px; border-radius: 4px; margin-bottom: 16px; }
    h2 { margin: 0 0 24px 0; font-size: 22px; color: #ffffff; font-weight: 700; }
    .field { margin-bottom: 20px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .value { font-size: 16px; color: #f8fafc; font-weight: 500; }
    .message-box { background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 18px; font-size: 15px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; }
    .reply-btn { display: inline-block; margin-top: 24px; background-color: #2563eb; color: #ffffff !important; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .footer { margin-top: 32px; border-top: 1px solid #334155; padding-top: 16px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Portfolio Inquiry</div>
    <h2>Someone contacted you through your portfolio</h2>
    
    <div class="field">
      <div class="label">Sender Name</div>
      <div class="value">{{visitorName}}</div>
    </div>

    <div class="field">
      <div class="label">Sender Email</div>
      <div class="value"><a href="mailto:{{visitorEmail}}" style="color: #38bdf8;">{{visitorEmail}}</a></div>
    </div>

    <div class="field">
      <div class="label">Message</div>
      <div class="message-box">{{message}}</div>
    </div>

    <a href="mailto:{{visitorEmail}}?subject=Re: Portfolio Inquiry" class="reply-btn">Reply Directly →</a>

    <div class="footer">
      Delivered by Rudra Central Email Gateway
    </div>
  </div>
</body>
</html>
